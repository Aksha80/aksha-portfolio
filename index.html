<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksha Dadala - Portfolio</title>
    <!-- Google Fonts for Classic Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Vanilla CSS -->
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <h1 class="logo">Aksha Dadala</h1>
        <nav class="nav">
          <ul class="nav-list">
            <li><a href="#about">About</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#experience">Experience</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <!-- Hero Section -->
      <section id="about" class="section hero-section">
        <div class="container hero-container">
          <div class="hero-image-wrapper">
            <img id="profile-img" src="" alt="Aksha Dadala" class="profile-img skeleton">
          </div>
          <div class="hero-content">
            <h2 class="hero-title">Hello, I'm Aksha</h2>
            <p id="objective" class="hero-text skeleton-text"></p>
            <div class="hero-links" id="social-links">
              <!-- Links populated dynamically -->
            </div>
            <a id="resume-btn" href="#" target="_blank" class="btn btn-primary" style="display: none;">View Resume</a>
          </div>
        </div>
      </section>

      <!-- Education Section -->
      <section id="education" class="section bg-light">
        <div class="container">
          <h2 class="section-title">Education</h2>
          <div id="education-list" class="timeline">
            <!-- Populated dynamically -->
          </div>
        </div>
      </section>

      <!-- Skills Section -->
      <section id="skills" class="section">
        <div class="container">
          <h2 class="section-title">Skills</h2>
          <div id="skills-grid" class="skills-grid">
            <!-- Populated dynamically -->
          </div>
        </div>
      </section>

      <!-- Projects Section -->
      <section id="projects" class="section bg-light">
        <div class="container">
          <h2 class="section-title">Projects</h2>
          <div id="projects-list" class="cards-grid">
            <!-- Populated dynamically -->
          </div>
        </div>
      </section>

      <!-- Experience Section -->
      <section id="experience" class="section">
        <div class="container">
          <h2 class="section-title">Experience & Positions</h2>
          
          <h3 class="subsection-title">Internships</h3>
          <div id="experience-list" class="timeline">
            <!-- Populated dynamically -->
          </div>

          <h3 class="subsection-title mt-4">Positions of Responsibility</h3>
          <div id="positions-list" class="timeline">
            <!-- Populated dynamically -->
          </div>
        </div>
      </section>
      
      <!-- Certifications Section -->
      <section id="certifications" class="section bg-light">
        <div class="container">
          <h2 class="section-title">Certifications & Achievements</h2>
          <ul id="certifications-list" class="cert-list">
            <!-- Populated dynamically -->
          </ul>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 Aksha Dadala. All rights reserved.</p>
      </div>
    </footer>

    <!-- Firebase Logic -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
